
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patients-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ichetech/evinova-cloudops-gitops-lab.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops-lab

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

